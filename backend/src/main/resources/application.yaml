spring:
  application:
    name: kapotiabi
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kapotiabi}
    username: ${SPRING_DATASOURCE_USERNAME:kapotiabi}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-256-bits-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
